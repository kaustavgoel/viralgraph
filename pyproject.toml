[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viralgraph"
version = "0.1.0"
description = "Intelligent social information diffusion and virality prediction platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "ViralGraph Research Team"}
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.2.0",
    "networkx>=3.2.1",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "streamlit>=1.31.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["viralgraph*", "app*"]
