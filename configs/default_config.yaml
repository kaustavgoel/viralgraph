# ViralGraph Central Configuration

project:
  name: "ViralGraph"
  version: "0.1.0"
  random_seed: 42

# Synthetic Network Generation Defaults
synthetic_networks:
  barabasi_albert:
    n_nodes: 500
    m_edges_per_step: 3
  watts_strogatz:
    n_nodes: 500
    k_neighbors: 6
    rewire_prob: 0.1
  stochastic_block_model:
    community_sizes: [150, 150, 200]
    # Matrix of probabilities between communities
    probability_matrix:
      - [0.08, 0.005, 0.002]
      - [0.005, 0.07, 0.004]
      - [0.002, 0.004, 0.06]

# Discrete-Time Diffusion Simulation Defaults
diffusion:
  independent_cascade:
    default_p: 0.15
    max_steps: 50
    mc_iterations: 100
  linear_threshold:
    max_steps: 50
    mc_iterations: 100

# Machine Learning & Virality Prediction
prediction:
  observation_horizon_steps: 2     # Strict cutoff: only features up to t <= 2 used
  virality_percentile_threshold: 75 # Top 25% of cascades classified as "Viral"
  test_split_ratio: 0.2
  cv_folds: 5
